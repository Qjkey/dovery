<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('dovery-theme');
                if (theme !== 'dark' && theme !== 'light') {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <title>{{ profile_name or profile_username or 'Dovery' }}</title>
    <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
    <link href="/static/CSS/tma-ui-kit-3-0.css" rel="stylesheet" type="text/css">
    <link href="/static/CSS/svg.css" rel="stylesheet" type="text/css">
    <link href="/static/CSS/dovery.css" rel="stylesheet" type="text/css">
</head>
<style>
.page-two {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    box-sizing: border-box;
    overflow: hidden;
}

.page-two > .header-wrapper {
    position: relative;
    flex-shrink: 0;
    width: calc(100% - 2 * var(--margin));
    margin: var(--margin) var(--margin) 0;
    padding: 0;
    box-sizing: border-box;
}

.page-two > .header-wrapper .header {
    padding: 0;
}

.page-two-content {
    display: flex;
    flex-direction: column;
    width: calc(100% - 2 * var(--margin));
    max-width: 450px;
    flex: 1 1 0;
    min-height: 0;
    margin: var(--margin);
    box-sizing: border-box;
    overflow: hidden;
}

.page-two-content > .page {
    width: 100%;
    height: 60%;
    max-height: 100%;
    border-radius: var(--radius);
    box-sizing: border-box;
    overflow: hidden;
    overflow-y: auto;
}

.page-two-content .profile-block .headline6 {
    z-index: 1;
    color: var(--tg-theme-text-color);
}

.page-two-content .profile-block .subname {
    z-index: 1;
    color: var(--tg-theme-text-color);
}

.page-two-content .profile-block .avatar .letter-ava {
    width: 100%;
    height: 100%;
    font-family: "Roboto", sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1;
    border-radius: 50%;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--tg-theme-button-color) 70%, #fff),
        var(--tg-theme-button-color)
    );
    user-select: none;
    text-transform: uppercase;
}

@media (min-width: 751px) {
    .page-two > .header-wrapper {
        margin-top: var(--margin);
    }

    .page-two-content {
        margin-top: var(--margin);
        margin-left: auto;
        margin-right: auto;
        margin-bottom: var(--margin);
        height: auto;
    }
}

.title-title {
    margin-top: 7px;
}
</style>
<body class="one-page">
    <div class="page-two">
        <div class="header-wrapper">
            <div class="header">

                <div class="header-center-two clicked header-capsule">
                    <div class="item">
                        <div class="left">
                            <img src="/static/img/dovery.png" class="ava"> 
                        </div>
                        <div class="right">
                            <div class="label title-title headline6">Dovery</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-two-content">
            <div class="page secondary_bg">
                <div class="profile-block s-img defult" id="public-profile-block">
                    <div class="avatar{% if profile_avatar and profile_avatar not in ('avatarkins.png', 'null') %} avatar-skeleton-active{% endif %}" id="public-profile-avatar">
                        {% if profile_avatar and profile_avatar not in ('avatarkins.png', 'null') %}
                        <img src="{{ url_for('static', filename='files/avatars/' + profile_avatar) }}" alt="">
                        {% else %}
                        <div class="letter-ava">{{ (profile_name or profile_username or '?')[:1] }}</div>
                        {% endif %}
                    </div>
                    <div class="headline6 name-with-badge-host" id="public-profile-name"><span class="name-with-badge"><span class="name-with-badge__text">{{ profile_name }}</span>{% if profile_verified %}<svg class="verified-badge" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.2021 0.165697C12.173 -0.275758 13.315 0.197687 13.6901 1.19656L14.0787 2.23462L14.0795 2.23542C14.3716 3.01351 14.9865 3.62839 15.7646 3.92047L15.7654 3.92127L16.8034 4.31074C17.8023 4.68501 18.2758 5.82704 17.8343 6.79792L17.3753 7.80879L17.3745 7.80959C17.0316 8.56571 17.0316 9.43429 17.3745 10.1904L17.3753 10.1912L17.8343 11.2021C18.2758 12.173 17.8023 13.3142 16.8034 13.6893L15.7646 14.0795L15.763 14.0803C14.9855 14.3723 14.3712 14.9869 14.0795 15.7646L14.0787 15.7662L13.6901 16.8042C13.315 17.8023 12.173 18.2758 11.2021 17.8343L10.1912 17.3753L10.1904 17.3745C9.43495 17.0314 8.56688 17.0311 7.81119 17.3737L7.49449 13.0687C7.74161 13.0799 7.99353 12.9919 8.18227 12.8032L13.3486 7.63685C13.7045 7.28096 13.7045 6.70355 13.3486 6.34767C12.9927 5.99179 12.4153 5.99179 12.0594 6.34767L7.52488 10.883L5.9406 9.2995C5.58472 8.94362 5.00651 8.94362 4.65063 9.2995C4.29474 9.65538 4.29474 10.2336 4.65063 10.5895L6.8635 12.8016C7.03075 12.9691 7.25696 13.065 7.49369 13.0687L7.80959 17.3745L7.80879 17.3753L6.79792 17.8343C5.82704 18.2758 4.68502 17.8023 4.31074 16.8042L3.92047 15.7646V15.7638C3.62811 14.986 3.01329 14.3715 2.23542 14.0795L2.23382 14.0787L1.19656 13.6893C0.197687 13.3142 -0.275758 12.173 0.165697 11.2021L0.625546 10.1912C0.969434 9.43466 0.968634 8.56614 0.625546 7.80959V7.80879L0.165697 6.79792C-0.275758 5.82704 0.197687 4.68501 1.19656 4.31074L2.23462 3.92127L2.23542 3.92047C3.01351 3.62839 3.62839 3.01351 3.92047 2.23542L4.31074 1.19656C4.68502 0.197687 5.82704 -0.275758 6.79792 0.165697L7.80879 0.625546C8.56527 0.969349 9.43473 0.969349 10.1912 0.625546L10.192 0.624746H10.1928L11.2021 0.165697Z" fill="currentColor"/></svg>{% endif %}</span></div>
                    <div class="subname subtitle1" id="public-profile-username">@{{ profile_username }}</div>
                </div>
                <section class="top">
                    <a href="/" class="item clicked">
                        <div class="right">
                            <div class="text oneline">
                                <div class="label body1">Открыть чат</div>
                            </div>
                            <div class="element">
                                <svg width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L6 6L1 11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </div>
                        </div>
                    </a>
                </section>
            </div>
        </div>
    </div>
</body>
<script src="/static/js/tma-ui-kit-3-0.js"></script>
<script>
(function () {
    var block = document.getElementById('public-profile-block');
    var avatar = document.getElementById('public-profile-avatar');
    if (!block || !avatar) return;

    var revealProfile = function () {};

    var img = avatar.querySelector('img');
    if (!img) {
        avatar.classList.remove('avatar-skeleton-active');
        revealProfile();
        return;
    }

    var done = function () {
        avatar.classList.remove('avatar-skeleton-active');
        revealProfile();
    };

    if (img.complete && img.naturalWidth > 0) {
        done();
        return;
    }

    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
})();
</script>
</html>
